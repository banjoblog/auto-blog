name: Auto Post YouTube Long Video

on:
  schedule:
    - cron: '0 10 * * 2,5'  # 毎週火曜・金曜の日本時間19:00に自動実行（毎日なら '0 10 * * *'）
  workflow_dispatch:

jobs:
  build-and-post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-noto-cjk ffmpeg
          pip install google-genai edge-tts moviepy==1.0.3 Pillow numpy requests google-api-python-client google-auth
      - name: Run auto_long_video.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python auto_long_video.py
