name: Auto Post Short Video

on:
  schedule:
    - cron: '0 9 * * *' # 毎日 日本時間18:00（UTC 09:00）に自動実行
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "video-repo-push"
  cancel-in-progress: false

jobs:
  build-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-noto-cjk ffmpeg
          pip install google-genai edge-tts moviepy==1.0.3 Pillow numpy requests google-api-python-client google-auth
      - name: Run auto_video.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
        run: python auto_video.py
      - name: Save used_topics.json
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add used_topics.json
          git diff --staged --quiet || git commit -m "chore: update used_topics.json from short"
          git pull --rebase -X ours origin main
          git push
