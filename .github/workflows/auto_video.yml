name: Daily Auto Video Generator

on:
  schedule:
    - cron: '0 3 * * *' # 毎日日本時間 12:00 に自動生成
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-video:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies & fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core imagemagick
          # ImageMagickのセキュリティ制限を解除（MoviePy用）
          sudo sed -i 's/rights="none" pattern="LABEL"/rights="read|write" pattern="LABEL"/' /etc/ImageMagick-6/policy.xml

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai edge-tts moviepy pillow

      - name: Run Auto Video Generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python auto_video.py

      - name: Upload Video Artifact
        uses: actions/upload-artifacts-and-build@v4
        with:
          name: generated-shorts-video
          path: output_shorts.mp4
