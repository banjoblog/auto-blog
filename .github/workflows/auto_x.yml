name: Auto Post to X

on:
  schedule:
    - cron: '30 22 * * *' # 毎日 日本時間 07:30（UTC 22:30）
    - cron: '15 3 * * *'  # 毎日 日本時間 12:15（UTC 03:15）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "video-repo-push"
  cancel-in-progress: false

jobs:
  post-tweet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install google-genai tweepy
      - name: Run auto_x_post.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python auto_x_post.py
      - name: Save used_topics.json
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add used_topics.json
          git diff --staged --quiet || git commit -m "chore: update used_topics.json from X"
          git pull --rebase -X ours origin main
          git push
